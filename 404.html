<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Page Not Found | Brad Stricherz</title>
    <meta name="description" content="That page does not exist on GeoBrad.dev. Head back to the homepage for geospatial software work, services, and contact details.">
    <link rel="canonical" href="https://www.geobrad.dev/404.html">

    <!-- An error page has nothing to offer a search result. -->
    <meta name="robots" content="noindex">

    <!-- The same Lato the rest of the site loads, so a mistyped URL still
         lands somewhere that looks like this site. -->
    <link href="https://fonts.googleapis.com/css?family=Lato:400,400i,700,700i" rel="stylesheet">

    <!-- Root-absolute, unlike every other page's. GitHub Pages serves this
         document at whatever URL was requested, without redirecting, so the
         document base is the mistyped path: a relative href would resolve
         /blog/post to /blog/img/favicon.ico and find nothing. -->
    <link rel="icon" href="/img/favicon.ico">

    <style>
        /* Lifted from thanks.html, which lifted it from css/style.css: the
           55px rule is .s-line and the button is .submit-btn, which fills
           #333 and inverts to transparent on hover. Two standalone pages
           carrying the same forty lines beats either of them pulling in
           bootstrap.min.css and style.css for one panel. */
        body {
            margin: 0;
            padding: 30px;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Lato', sans-serif;
            font-size: 15px;
            font-weight: 400;
            line-height: 1.75;
            letter-spacing: 1px;
            background-color: #fff;
            color: #484848;
        }

        .panel {
            max-width: 480px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 700;
            line-height: 1.2;
            color: #333;
        }

        .rule {
            margin: 12px auto 0;
            width: 55px;
            height: 1px;
            background-color: #333;
        }

        p {
            margin: 22px 0 30px;
            font-size: 16px;
            line-height: 26px;
        }

        .back-btn {
            display: inline-block;
            padding: 8px 20px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border: 2px solid #333;
            background-color: #333;
            color: #fafafa;
            transition: all .4s ease-in-out;
        }

        .back-btn:hover {
            color: #111;
            background-color: transparent;
        }

        /* Keyboard users get an outline the hover state cannot supply, and it
           has to sit outside the border to stay visible against the fill. */
        .back-btn:focus-visible {
            outline: 2px solid #333;
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            .back-btn {
                transition: none;
            }
        }
    </style>
</head>
<body>

<div class="panel">
    <h1>Page not found</h1>
    <div class="rule"></div>
    <p>That URL does not lead anywhere on this site. It may have moved, or the link that sent you here may be wrong.</p>
    <a class="back-btn" href="/">Back to GeoBrad.dev</a>
</div>

</body>
</html>
